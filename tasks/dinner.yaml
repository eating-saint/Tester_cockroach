# 任务书：今晚吃什么（Bing 真实站点，人工验收 E3 / AC19 用；Yelp 版见 dinner_yelp.yaml）
# 【草稿，待用户确认】品类、地点、"便宜"的标准、每类打开几家、每类留几个，验收前与用户确认。
format: taskbook/1
name: dinner
title: 今晚吃什么（Bing）
note: 人工验收样例。每个品类：搜索 → 滚动看完 → 抽结果里的餐厅名 → 依次打开前 3 家读店名、价位、评分 → 价位不高于 $$ 的、价位未知的作为品类的值（直接是末端叶子）→ 按价位升序、评分降序每类取前 3 个。
params:
  - {name: location, type: text, default: "", label: 地点}
groups:
  - 晚餐: [韩式拌饭, 日本寿司, 中式炒菜]
start: 晚餐
limits: {budget: 30, keep_tabs: 15, trial_budget: 5}
flow:
  - search: {url: "https://www.bing.com/search?q={q}", query: "便宜 {word} 餐厅 {location}"}
  - scroll_all: {mode: bottom_then_top}
  - pick_list: {region: 搜索结果里的餐厅名称（本地商家卡片或点评网站的餐厅条目）, max: 6, screens: 4, as: 餐厅}
  - open:
      from: 餐厅
      n: 1
      count: 3
      back: true
      flow:
        - read_fields: {names: [店名, 价位, 评分], name_field: 店名, as: 详情}
  - compare: {in: 详情, field: 价位, op: "<=", value: "$$", as: 便宜, unknown_as: 价位未知}
  - tree: {use: 便宜, op: add_to_current, new_terminal: true}
  - tree: {use: 价位未知, op: add_to_current, new_terminal: true}
output: {type: ranked, sort: ["价位:asc", "评分:desc"], n: 3, group_by: key, unknown: last}

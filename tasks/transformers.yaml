# 任务书：变形金刚角色（Google 真实站点，人工验收 E2 / AC18 用）
# 【草稿，待用户确认】初始组、搜索词、阈值、别名表按上一章对话里的例子起草，验收前与用户逐项确认后再改。
format: taskbook/1
name: transformers
title: 变形金刚角色（Google）
note: 人工验收样例。每个节点：搜索（固定英文结果）→ 滚动看完 → 抽结果标题摘要和相关搜索 → 前 10 条里 ≥80% 提到的已知词加为当前词的值 → 相关搜索里的已知词（别名、译名先归一，去掉当前词）加为当前词的值。
params:
  - {name: lang, type: text, default: en, label: 结果语言（hl 参数）}
groups:
  - optimus: [galvatron, megatron, starscream]
  - megatron: [starscream, shockwave, soundwave]
  - movie: [fallen, decepticon, autobot]
start: optimus
limits: {budget: 120, keep_tabs: 30, trial_budget: 5}
flow:
  - search: {url: "https://www.google.com/search?q={q}", query: "{word} transformers", extra: {hl: "{lang}"}}
  - scroll_all: {mode: bottom_then_top}
  - pick_list: {region: 搜索结果的标题和摘要, max: 10, as: 结果}
  - pick_list:
      region: 页面底部的相关搜索（People also search for / Related searches / 相关搜索）
      anchor: [Related searches, People also search for, 相关搜索, 其他人还搜索了]
      max: 12
      as: 相关
  - ratio: {in: 结果, top: 10, words: 已知词, at_least: 0.8, drop_current: true, as: 高频}
  - tree: {use: 高频, op: add_to_current}
  - filter:
      in: 相关
      alias: {擎天柱: optimus, Optimus Prime: optimus, 威震天: megatron, 红蜘蛛: starscream, 震荡波: shockwave,
              声波: soundwave, 霸天虎: decepticon, 汽车人: autobot, 惊破天: galvatron}
      contains: true
      drop_current: true
      only_known: true
      as: 相关已知
  - tree: {use: 相关已知, op: add_to_current}
output: {type: leaves}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hands"
version = "0.0.1"
description = "ver0 headless browser hands (CDP) for LLM-driven testing"
requires-python = ">=3.11"
dependencies = ["websockets", "httpx", "pillow", "pyyaml"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
panel = ["aiohttp", "pywebview"]
build = ["pyinstaller"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
panel = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

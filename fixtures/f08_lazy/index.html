<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F8 懒加载</title>
<style>body{margin:0;font:14px sans-serif} .item{height:80px;border-bottom:1px solid #ddd;padding:10px}</style></head>
<body>
  <div id="list"></div>
  <div id="loading" style="height:40px"></div>
  <script>
    const list = document.getElementById("list");
    for (let i = 1; i <= 20; i++) {
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<a href="#p1-${i}">第一页-${i}</a>`;
      list.appendChild(d);
    }
    let loaded = false;
    window.addEventListener("scroll", () => {
      if (loaded) return;
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 100) {
        loaded = true;
        fetch("/api/page?n=2").then(r => r.json()).then(j => {
          j.items.forEach((t, i) => {
            const d = document.createElement("div");
            d.className = "item";
            d.innerHTML = `<a href="#p2-${i + 1}">${t}</a>`;
            list.appendChild(d);
          });
        });
      }
    });
  </script>
</body></html>

<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F13 Turnstile 总是通过</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body style="font:14px sans-serif;padding:30px">
  <h1>下单前验证（Turnstile 官方测试密钥：总是通过）</h1>
  <p>站点密钥 1x00000000000000000000AA：Cloudflare 公布的测试密钥，验证框会自动通过，不针对任何真实网站。需要联网。</p>
  <form id="f" onsubmit="event.preventDefault();document.getElementById('out').textContent='已提交，token 长度 '+(document.querySelector('[name=cf-turnstile-response]')||{value:''}).value.length">
    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onOk"></div>
    <button type="submit">提交</button>
  </form>
  <p id="out"></p>
  <script>function onOk(){ document.getElementById('out').textContent = '验证已通过'; }</script>
</body></html>

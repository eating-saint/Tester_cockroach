<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F19 密集元素</title>
<style>
  body { margin: 0; padding: 24px; font: 13px sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(16, 22px); gap: 3px; margin-top: 12px; }
  #grid button { width: 22px; height: 20px; padding: 0; font-size: 10px; }
  #grid button:nth-child(3n) { width: 18px; height: 16px; }
</style></head>
<body>
  <h1 style="font-size:18px;margin:0">密集按钮</h1>
  <p>80 个紧挨的小按钮，用来检查编号牌是否互相遮挡。</p>
  <div id="grid"></div>
  <script>
    const g = document.getElementById("grid");
    for (let i = 1; i <= 80; i++) { const b = document.createElement("button"); b.type = "button"; b.textContent = String(i); b.setAttribute("aria-label", "按钮 " + i); g.appendChild(b); }
  </script>
</body></html>

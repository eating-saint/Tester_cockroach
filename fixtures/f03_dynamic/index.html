<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F3 动态加载</title></head>
<body style="font:14px sans-serif">
  <h1>动态列表</h1>
  <ul id="list"></ul>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("/api/delay?ms=2000&data=items").then(r => r.json()).then(() => {
        const ul = document.getElementById("list");
        for (let i = 1; i <= 6; i++) {
          const li = document.createElement("li");
          li.innerHTML = `<a href="#item${i}">条目${i}</a>`;
          ul.appendChild(li);
        }
      });
    });
  </script>
</body></html>

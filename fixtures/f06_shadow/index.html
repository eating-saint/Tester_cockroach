<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F6 Shadow DOM</title></head>
<body style="margin:0;padding:60px 40px;font:14px sans-serif">
  <div id="result">none</div>
  <x-panel></x-panel>
  <script>
    class XPanel extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `<style>button{margin:30px 0 0 50px}</style>
          <button id="btn-shadow">影子按钮</button><div id="o"></div>`;
        root.getElementById("btn-shadow").addEventListener("click", () => {
          root.getElementById("o").textContent = "clicked:shadow";
          document.getElementById("result").textContent = "clicked:shadow";
        });
      }
    }
    customElements.define("x-panel", XPanel);
  </script>
</body></html>

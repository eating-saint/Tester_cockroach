<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F2 隐藏元素</title>
<style>body { margin: 0; font: 14px sans-serif; } button { display: block; margin: 8px 20px; }</style></head>
<body>
  <button id="n1">正常一</button>
  <button id="n2">正常二</button>
  <button id="dn1" style="display:none">隐藏一</button>
  <button id="dn2" style="display:none">隐藏二</button>
  <button id="vh1" style="visibility:hidden">不可见一</button>
  <button id="vh2" style="visibility:hidden">不可见二</button>
  <button id="ds1" disabled>禁用一</button>
  <button id="ds2" disabled>禁用二</button>
  <button id="off1" style="position:absolute;left:-9999px;top:10px">屏外一</button>
  <button id="off2" style="position:absolute;left:10px;top:-9999px">屏外二</button>
</body></html>

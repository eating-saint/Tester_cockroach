<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>夹具商城 商品</title>
<style>body{font:16px sans-serif;margin:30px} .card{border:1px solid #ccc;padding:12px;width:360px;margin:10px 0}</style></head>
<body>
  <p><input id="q" type="search" aria-label="搜索商品" placeholder="搜索商品"> <span id="res"></span></p>
  <div class="card"><h2>麻辣香锅（大份）</h2><p>¥39</p>
    <button id="cart">加入购物车</button> <button id="fav">收藏</button> <a href="detail.html">查看详情</a></div>
  <p id="count">购物车 0 · 收藏 0</p>
  <script>
    let c = 0, f = 0;
    const show = () => document.getElementById("count").textContent = `购物车 ${c} · 收藏 ${f}`;
    document.getElementById("cart").onclick = () => { c++; show(); };
    document.getElementById("fav").onclick = () => { f++; show(); };
    document.getElementById("q").addEventListener("keydown", ev => {
      if (ev.key === "Enter") document.getElementById("res").textContent = "搜索结果：" + ev.target.value;
    });
  </script>
</body></html>

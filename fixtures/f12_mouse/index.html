<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F12 鼠标轨迹</title>
<style>
  body{margin:0;font:14px sans-serif;height:2600px;background:linear-gradient(#fff,#eef)}
  button{position:absolute;width:96px;height:40px}
  #b-c{left:592px;top:330px}
  #b-e{left:952px;top:330px}   #b-se{left:872px;top:560px}  #b-s{left:592px;top:640px}
  #b-sw{left:312px;top:560px}  #b-w{left:232px;top:330px}   #b-nw{left:312px;top:100px}
  #b-n{left:592px;top:30px}    #b-ne{left:872px;top:100px}
  #b-tiny{left:1100px;top:700px;width:12px;height:12px;padding:0;min-width:0}
  #status{position:fixed;left:8px;bottom:8px;background:#fff8;padding:4px}
</style></head>
<body>
  <button id="b-c">中心</button>
  <button id="b-e">东</button><button id="b-se">东南</button><button id="b-s">南</button><button id="b-sw">西南</button>
  <button id="b-w">西</button><button id="b-nw">西北</button><button id="b-n">北</button><button id="b-ne">东北</button>
  <button id="b-tiny" aria-label="小按钮"></button>
  <div id="status">moves: 0</div>
<script>
  // 只记录，不改变按钮布局：mousemove 计数，点击时记下坐标和自上次点击以来的移动次数
  window.__moves = 0; window.__clicks = [];
  let since = 0;
  document.addEventListener('mousemove', e => { window.__moves++; since++;
    document.getElementById('status').textContent = 'moves: ' + window.__moves; });
  document.querySelectorAll('button').forEach(b => b.addEventListener('click', e => {
    const r = b.getBoundingClientRect();
    window.__clicks.push({id: b.id, x: e.clientX, y: e.clientY, rect: [r.x, r.y, r.width, r.height], moves: since});
    since = 0;
  }));
</script>
</body></html>

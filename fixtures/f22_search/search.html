<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>夹具搜索</title>
<style>
  body{font:14px sans-serif;margin:0;padding:20px}
  #main{width:640px}
  .r{margin:0 0 14px} .r a{font-size:16px} .r p{margin:2px 0;color:#444}
  #more{height:900px;color:#999;border-top:1px dashed #ddd;padding-top:8px}
  #side{border-top:1px solid #ddd;padding-top:8px;width:640px}
  #pager{margin:16px 0}
</style></head>
<body>
  <div id="main">
    <form action="search.html"><input type="search" name="q" aria-label="搜索" id="q" style="width:400px"> <button>搜索</button></form>
    <h2 id="head"></h2>
    <div id="results" role="list"></div>
    <div id="more">（其它内容：让「相关搜索」落在第一屏之外，要滚动才看得到）</div>
  </div>
  <section id="side"><h3>相关搜索</h3><div id="related"></div></section>
  <div id="pager"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const q = (params.get("q") || "").trim();
    const page = Math.max(1, +(params.get("p") || 1));
    document.getElementById("q").value = q;
    document.title = (q || "夹具搜索") + (page > 1 ? ` 第 ${page} 页` : "") + " - 夹具搜索";
    document.getElementById("head").textContent = "「" + q + "」的搜索结果" + (page > 1 ? `（第 ${page} 页）` : "");
    fetch("script.json").then(r => r.json()).then(s => {
      const hit = s[q.toLowerCase()] || {results: [], related: []};
      let res = hit.results.length ? hit.results :
        Array.from({length: 10}, (_, i) => ({title: q + " 无关结果 " + (i + 1), snippet: "与本词关系不大的普通页面。"}));
      if (page > 1)
        res = Array.from({length: 10}, (_, i) => ({title: `${q} 第 ${page} 页结果 ${i + 1}`, snippet: "第二页的普通页面。"}));
      const box = document.getElementById("results");
      res.forEach((r, i) => {
        const d = document.createElement("div"); d.className = "r"; d.setAttribute("role", "listitem");
        d.innerHTML = `<a href="result.html?q=${encodeURIComponent(q)}&i=${i}"></a><p></p>`;
        d.querySelector("a").textContent = r.title; d.querySelector("p").textContent = r.snippet;
        box.appendChild(d);
      });
      const rel = document.getElementById("related");
      (page > 1 ? [] : (hit.related || [])).forEach(w => {
        const a = document.createElement("a"); a.href = "search.html?q=" + encodeURIComponent(w);
        a.textContent = w; a.style.display = "block"; rel.appendChild(a);
      });
      if (page > 1 || !(hit.related || []).length) rel.textContent = "（无）";
      if (page < 2) {    // 只有两页：第 1 页底部有「下一页」
        const a = document.createElement("a");
        a.href = `search.html?p=${page + 1}&q=${encodeURIComponent(q)}`; a.textContent = "下一页";
        document.getElementById("pager").appendChild(a);
      }
    });
  </script>
</body></html>

<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F1 静态页</title>

<body>

  <a id="l6" class="a" style="left:100px;top:200px" href="#6">链接六</a>
  <a id="l7" class="a" style="left:600px;top:500px" href="#7">链接七</a>

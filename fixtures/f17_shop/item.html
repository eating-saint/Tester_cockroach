<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>F17 商品详情</title>
<link rel="stylesheet" href="shop.css"><script src="shop.js"></script></head>
<body>
<header class="top">
  <span class="logo">小馆外卖</span>
  <nav aria-label="主导航"><a href="index.html">首页</a><a href="cart.html">购物车 (<span id="cart-count">0</span>)</a></nav>
</header>
<div class="wrap"><main>
  <section class="detail" id="detail"></section>
</main></div>
<footer>小馆外卖 · 本页是本地测试夹具</footer>
<script>
(function () {
  const id = parseInt(new URLSearchParams(location.search).get("id") || "0", 10);
  const p = PRODUCTS.find(x => x.id === id);
  const el = document.getElementById("detail");
  if (!p) { el.innerHTML = `<p class="empty">商品不存在</p>`; return; }
  document.title = p.name + " - 小馆外卖";
  el.innerHTML = `<h1 id="title">${esc(p.name)}</h1>
    <div class="row">价格：<span id="price">${esc(p.price)}</span></div>
    <div class="row">评分：<span id="rating">${esc(p.rating)}</span></div>
    <div class="row">配送时间：<span id="eta">${esc(p.eta)}</span></div>
    <div class="row">分类：${esc(p.cat)}</div>
    <p>精选食材现做，下单后由附近门店配送。</p>
    <button type="button" onclick="addToCart(${p.id})">加入购物车</button>
    <a href="index.html">返回首页</a>`;
  maybePopup();
})();
</script>
</body></html>

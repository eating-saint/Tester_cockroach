# ver0 全局配置；不写的项使用默认值
driver: cdp                # 浏览器驱动：cdp = 自写原生 CDP；playwright = Playwright（需 pip install -e .[pw]，用本机 Chrome）
decision: rule             # 决策方式：rule = 规则决策；vlm = 视觉大模型决策（需本机 Ollama，见下方 vlm 段）
chrome_path: ""            # 留空 = 自动查找
profile_dir: profiles/ver0
headless: true
window: [1280, 800]
quiet_ms: 500              # 网络安静需保持的毫秒数
nav_timeout_s: 30
cmd_timeout_s: 30
watchdog_interval_s: 0.5
max_crash_reruns: 2
min_interval_s:
  bing.com: 20
captcha_markers:
  - captcha
  - challenge
  - recaptcha
  - hcaptcha
  - turnstile
  - verify you are human
  - 验证您是人类
  - 人机验证
  - challenges.cloudflare.com
  - robot or human            # PerimeterX 类“按住按钮”验证（如 Walmart）
  - human challenge
  - 人工验证挑战
runs_dir: runs

# 鼠标轨迹与可选干扰项（默认全部关闭，关闭时行为和 ver0 完全一样）
# 命令行快捷开关：python -m hands run 用例.yaml --humanize [--seed 1234]
#                 只开部分：--humanize-only mouse 或 --humanize-only mouse,think
humanize:
  seed: null               # 留空 = 每次运行随机生成，写进 report.json；填同一个数可完整重放
  mouse:
    enabled: false         # 鼠标轨迹：8 方向 × 5 模板、横向抖动、过冲回拉、框内随机落点
    step_ms: 16            # 轨迹点间隔
    min_duration_ms: 180
    max_duration_ms: 1100
    overshoot_prob: 0.7
    land_margin: 0.2       # 落点离按钮边缘至少留出的比例
    source: template       # template = 40 套模板；library = 真实轨迹库回放（库里该方向没样本时退回模板）
    device: mouse          # 轨迹库挑哪种设备的样本：mouse / touchpad / mixed
    library_path: trajlib/samples.json   # 轨迹库文件，相对数据目录
  think:
    enabled: false         # 动作前随机停顿
    prob: 0.5
    min_ms: 300
    max_ms: 1500
  scroll_jitter:
    enabled: false         # 动作前随机滚几下再滚回原位（误差 ≤1 像素）
    prob: 0.3
    min_px: 60
    max_px: 320
    max_ticks: 3
    pause_min_ms: 150
    pause_max_ms: 600

# 轨迹采集目标（控制面板用）：每个设备（鼠标 / 触控板）、每个方向各采多少条；本地和真实网站分开计数
collect:
  local_per_dir: 20        # 本地采集页（/collect）
  real_per_dir: 20         # 真实网站采集

# 视觉大模型决策（decision: vlm 时使用；不写的项用默认值）
# vlm:
#   base_url: http://127.0.0.1:11434   # 本机 Ollama
#   model: qwen3.5:4b
#   timeout_s: 120
#   num_ctx: 16384
#   temperature: 0.2
#   seed: 1234
#   max_side: 1280                    # 截图缩放后的长边（像素）
#   prompts_dir: null                 # 留空 = 用程序自带的提示词

# 兜底拦截：动作执行前拦住下单、支付类点击，对所有决策方式生效，不能整体关闭，只能增删清单
# guard:
#   add_words: []                     # 追加拦截词
#   remove_words: []                  # 去掉内置拦截词
#   add_paths: []                     # 追加拦截网址路径
#   remove_paths: []

# 桌面驱动（driver: desktop；需 pip install -e .[desktop]）：在默认 Chrome Profile 里新开一个代理窗口，
# 用截图 + 无障碍树看页面、用系统鼠标键盘操作。人一碰鼠标键盘就暂停。不写的项用默认值。
# desktop:
#   window: [100, 60, 1280, 860]      # 代理窗口位置与大小（屏幕物理像素）x, y, w, h
#   stable_ms: 600                    # 截图保持不变多久算页面稳定
#   settle_timeout_s: 20              # 等待稳定的总超时
#   idle_resume_s: 0                  # 人停手 N 秒自动恢复；0 = 只能手动恢复（面板“恢复”或命令行回车）
#   resume_grace_s: 2                 # 恢复后宽限期：这段时间内的鼠标键盘不触发暂停
#   grid: {cols: 12, rows: 8, min_elements: 3}   # 网格兜底：可用元素少于 min_elements 时叠加网格

# 需确认（加入购物车、收藏、关注、写评价、预订、提交表单等先问“允许一次 / 拒绝”；登录、密码、短信验证转人工）
# 不写 enabled 时：桌面驱动开，CDP / Playwright 关。下单、支付仍由上面的兜底拦截硬拦，不能放行。
